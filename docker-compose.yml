services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: daily_notes
      PORT: 3000
      # Reach the host's Ollama from inside the container.
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      BACKUP_DIR: /backups
      # Daily backup: BACKUP_SCHEDULE=on|off, BACKUP_HOUR=0-23 (local time).
      BACKUP_SCHEDULE: "on"
      BACKUP_HOUR: "2"
      # Email a note via Gmail. Create an App Password (needs 2-Step Verification)
      # at https://myaccount.google.com/apppasswords. Put real values in a .env
      # file (gitignored) next to docker-compose.yml; these read from it.
      GMAIL_USER: "${GMAIL_USER:-}"
      GMAIL_APP_PASSWORD: "${GMAIL_APP_PASSWORD:-}"
    volumes:
      # Markdown backups land here on the host (daily-notes/backups).
      - ./backups:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
