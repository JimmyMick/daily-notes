<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Notes</title>
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="sidebar">
    <h1>📓 Daily Notes</h1>

    <div class="control">
      <label for="datePicker">Jump to date</label>
      <input type="date" id="datePicker" />
    </div>

    <div class="control">
      <label for="searchBox">Search notes</label>
      <input type="search" id="searchBox" placeholder="search content…" autocomplete="off" />
      <ul id="searchResults"></ul>
    </div>

    <h2 id="notesHeading">All notes</h2>
    <label class="archived-toggle"><input type="checkbox" id="showArchived" /> Show archived</label>
    <ul id="noteList"></ul>

    <div class="ref-head">
      <h2>Reference notes</h2>
      <button id="newRefBtn" title="Create a reference note">+ New</button>
    </div>
    <ul id="refList"></ul>
  </aside>

  <main>
    <header>
      <h2 id="currentDate">—</h2>
      <div class="header-right">
        <span id="status"></span>
        <select id="modelSelect" title="Ollama model used for summaries"></select>
        <button id="summarizeBtn" title="Summarize this note with local Ollama">✨ Summarize</button>
        <button id="emailBtn" title="Email this note via Gmail">✉ Email</button>
        <button id="archiveBtn" title="Archive this day (kept in the store, hidden from the list)">🗄 Archive</button>
        <button id="renameRefBtn" title="Rename this reference note" hidden>✎ Rename</button>
        <button id="deleteRefBtn" title="Delete this reference note" hidden>🗑 Delete</button>
        <button id="settingsBtn" title="Settings">⚙</button>
      </div>
    </header>

    <div id="settingsOverlay" hidden>
      <div id="settingsModal">
        <div class="settings-head">
          <strong>Settings</strong>
          <button id="closeSettings" title="Close">✕</button>
        </div>

        <label class="setting">
          <span>Default summary model</span>
          <select id="setDefaultModel"></select>
        </label>

        <label class="setting">
          <span>Daily backup</span>
          <input type="checkbox" id="setBackupSchedule" />
        </label>

        <label class="setting">
          <span>Backup time</span>
          <select id="setBackupHour"></select>
        </label>

        <label class="setting">
          <span>Email notes to</span>
          <input type="email" id="setEmailTo" placeholder="you@example.com" />
        </label>

        <div class="settings-actions">
          <button id="backupNowBtn">⬇ Back up now</button>
          <span id="settingsStatus"></span>
          <button id="saveSettings" class="primary">Save</button>
        </div>

        <p class="settings-note">
          Backups are written to the folder mounted at <code>./backups</code> in
          <code>docker-compose.yml</code>. To change <em>where</em> on disk they
          land, edit that volume mount.
        </p>
      </div>
    </div>
    <div id="summaryPanel" hidden>
      <div class="summary-head">
        <strong>Summary</strong>
        <span id="summaryModel"></span>
        <button id="insertSummary" title="Append this summary to the note">⤵ Insert into note</button>
        <button id="closeSummary" title="Close">✕</button>
      </div>
      <div id="summaryBody"></div>
    </div>
    <textarea id="editor"></textarea>
  </main>

  <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
  <!-- Pin to match the backend (package.json) and because newer majors dropped
       this UMD min build — an unpinned URL 404s and breaks the preview. -->
  <script src="https://unpkg.com/marked@14.1.4/marked.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
